name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: malldb
          MYSQL_USER: malldbuser
          MYSQL_PASSWORD: malldbuser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u malldbuser -pmalldbuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle pakages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/mallapi/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x backend/mallapi/gradlew

      - name: Create test application.properties
        run: |
          mkdir -p backend/mallapi/src/test/resources
          echo "spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver" > backend/mallapi/src/test/resources/application.properties
          echo "spring.datasource.url=jdbc:mysql://localhost:3306/malldb" >> backend/mallapi/src/test/resources/application.properties
          echo "spring.datasource.username=malldbuser" >> backend/mallapi/src/test/resources/application.properties
          echo "spring.datasource.password=malldbuser" >> backend/mallapi/src/test/resources/application.properties
          echo "spring.jpa.hibernate.ddl-auto=update" >> backend/mallapi/src/test/resources/application.properties
          echo "com.mysite.upload.path=upload" >> backend/mallapi/src/test/resources/application.properties
          cat backend/mallapi/src/test/resources/application.properties

      - name: Build with Gradle
        run: ./gradlew build --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/malldb
          SPRING_DATASOURCE_USERNAME: malldbuser
          SPRING_DATASOURCE_PASSWORD: malldbuser
        working-directory: backend/mallapi
